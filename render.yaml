# Render Blueprint: runs all four services in one free web service.
# Only order-service (and its web UI) is public. The other three talk to it on localhost.
services:
  - type: web
    name: order-management-system
    runtime: node
    plan: free
    branch: account-balance
    buildCommand: npm install
    startCommand: npm run dev
    healthCheckPath: /health
    envVars:
      # node:sqlite needs no flag from Node 22.13 onward
      - key: NODE_VERSION
        value: "24"
      # four services open ports, so name the public one
      - key: PORT
        value: "10000"
